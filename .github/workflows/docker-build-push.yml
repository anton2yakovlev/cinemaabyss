name: Docker Build and Push

env:
  REGISTRY: ghcr.io

on:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/docker-build-push.yml'
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Monolith
        id: meta-monolith
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/monolith
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Monolith
        uses: docker/build-push-action@v6
        with:
          context: ./src/monolith
          file: ./src/monolith/Dockerfile
          push: true
          tags: ${{ steps.meta-monolith.outputs.tags }}
          labels: ${{ steps.meta-monolith.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Movies Service
        id: meta-movies
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/movies-service
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Movies Service
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/movies
          file: ./src/microservices/movies/Dockerfile
          push: true
          tags: ${{ steps.meta-movies.outputs.tags }}
          labels: ${{ steps.meta-movies.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Events Service
        id: meta-events
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/events-service
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Events Service
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/events
          file: ./src/microservices/events/Dockerfile
          push: true
          tags: ${{ steps.meta-events.outputs.tags }}
          labels: ${{ steps.meta-events.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Proxy Service
        id: meta-proxy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/proxy-service
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Proxy Service
        uses: docker/build-push-action@v6
        with:
          context: ./src/microservices/proxy
          file: ./src/microservices/proxy/Dockerfile
          push: true
          tags: ${{ steps.meta-proxy.outputs.tags }}
          labels: ${{ steps.meta-proxy.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api-tests:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: image-tag
        run: |
          echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Update docker-compose with built images
        run: |
          TAG=${{ steps.image-tag.outputs.tag }}
          REPO=${{ env.REGISTRY }}/${{ github.repository }}
          
          cat > docker-compose.override.yml << EOF
          version: '3.8'
          services:
            monolith:
              image: ${REPO}/monolith:${TAG}
            movies-service:
              image: ${REPO}/movies-service:${TAG}
            events-service:
              image: ${REPO}/events-service:${TAG}
            proxy-service:
              image: ${REPO}/proxy-service:${TAG}
          EOF

      - name: Start services with docker-compose
        run: |
          docker compose up -d
          
          echo "Waiting for services to be ready..."
          sleep 30
          
          docker compose ps

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install test dependencies
        working-directory: ./tests/postman
        run: npm install

      - name: Run API tests
        working-directory: ./tests/postman
        run: node run-tests.js --environment docker --reporters cli,junit

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: tests/postman/reports/

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Cleanup
        if: always()
        run: docker compose down -v

